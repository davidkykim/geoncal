<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://worshipteams.github.io/worshipteams/">
<title>찬양팀 주소가 바뀌었습니다</title></head>
<body style="font-family:-apple-system,sans-serif;text-align:center;padding:60px 20px">
<p>찬양팀 앱 주소가 바뀌었습니다.</p>
<p><a href="https://worshipteams.github.io/worshipteams/">새 주소로 이동</a></p>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes('/worship/'))r.unregister()}))}
caches&&caches.keys().then(ks=>ks.filter(k=>k.startsWith('worship-')).forEach(k=>caches.delete(k)));
location.replace('https://worshipteams.github.io/worshipteams/');
</script></body></html>
