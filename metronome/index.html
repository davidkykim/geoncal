<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://worshipteams.github.io/worshipteams/metronome/">
<title>메트로놈 주소가 바뀌었습니다</title></head>
<body style="font-family:-apple-system,sans-serif;text-align:center;padding:60px 20px">
<p>찬양팀 메트로놈 주소가 바뀌었습니다. 새 주소에서 찬양팀 앱 아이디로 로그인하면 곡과 재생목록이 그대로 있습니다.</p>
<p><a href="https://worshipteams.github.io/worshipteams/metronome/">새 주소로 이동</a></p>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes('/metronome/'))r.unregister()}))}
caches&&caches.keys().then(ks=>ks.filter(k=>k.startsWith('metronome-')).forEach(k=>caches.delete(k)));
location.replace('https://worshipteams.github.io/worshipteams/metronome/');
</script></body></html>
