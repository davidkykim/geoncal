<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>경외와 거룩</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="경외와 거룩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="supabase.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 줄 폭의 일기장. 위에 날짜·본문 범위, 아래로 본문 → 묵상 메모 → QT 노트가 흘러내려간다. 탭 4개는 상단 고정. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --sunk:#E3E9E6; --ink:#17232A; --muted:#58686C; --line:#D0D9D6;
  --accent:#1D5C55; --accent-ink:#FFFFFF; --accent-soft:#D5E6E2; --gold:#9C6F17;
  --hl-y:#FBE7A1; --hl-g:#D2ECC0; --hl-b:#C9E1F6; --hl-p:#F6D1DC;
  --ev-mission:#1C7769; --ev-worship:#3D4FB0; --ev-serve:#B87814; --ev-edu:#4A8427; --ev-family:#A8435F;
  --ev-school:#6A4FA3; --ev-job:#B83A2E; --ev-meet:#8A5A3C; --ev-kin:#2F7891; --ev-life:#5D6B78; --ev-fellow:#A23C8F;
  --danger:#B3261E; --sun:#C03636; --sat:#2C66AE;
  --f-scripture:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171A; --surface:#172126; --sunk:#0C1215; --ink:#E2EBE9; --muted:#91A2A4; --line:#29373B;
  --accent:#6BC0B0; --accent-ink:#0B1917; --accent-soft:#1D3834; --gold:#DDB257;
  --hl-y:#5A4A12; --hl-g:#2C4820; --hl-b:#1E3B55; --hl-p:#552638;
  --ev-mission:#49BAA9; --ev-worship:#8A99EE; --ev-serve:#E3A647; --ev-edu:#84C15A; --ev-family:#DE7D9E;
  --ev-school:#B39AE8; --ev-job:#F08A7E; --ev-meet:#D3A07E; --ev-kin:#6EC2DD; --ev-life:#A3B1BE; --ev-fellow:#E08BD0;
  --danger:#F0807A; --sun:#EE8888; --sat:#7DAEEC; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10171A; --surface:#172126; --sunk:#0C1215; --ink:#E2EBE9; --muted:#91A2A4; --line:#29373B;
  --accent:#6BC0B0; --accent-ink:#0B1917; --accent-soft:#1D3834; --gold:#DDB257;
  --hl-y:#5A4A12; --hl-g:#2C4820; --hl-b:#1E3B55; --hl-p:#552638;
  --ev-mission:#49BAA9; --ev-worship:#8A99EE; --ev-serve:#E3A647; --ev-edu:#84C15A; --ev-family:#DE7D9E;
  --ev-school:#B39AE8; --ev-job:#F08A7E; --ev-meet:#D3A07E; --ev-kin:#6EC2DD; --ev-life:#A3B1BE; --ev-fellow:#E08BD0;
  --danger:#F0807A; --sun:#EE8888; --sat:#7DAEEC; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:780px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px;margin-inline:-4px;padding-inline:4px}
.brand{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.brand b{font-family:var(--f-scripture);font-size:22px;font-weight:700;letter-spacing:.02em}
.sync{font-size:12px;color:var(--muted)}
.sync.err{color:var(--danger)}
.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:10px;padding:4px;background:var(--sunk);border-radius:12px}
.tabs button{border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:500;color:var(--muted);font-size:14px;white-space:nowrap}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.notice{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);font-size:13px}

section.panel{padding-top:22px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0}
.lbl{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;font-size:16px;padding:0}

/* date bar */
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datebar input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.qt-head{display:flex;flex-direction:column;gap:6px}
.ref{font-family:var(--f-scripture);font-size:30px;font-weight:700;line-height:1.3;margin-top:8px}
.ptitle{font-family:var(--f-scripture);font-size:18px;margin:0;color:var(--gold)}
.refedit{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.refedit input{flex:1 1 180px;min-width:0}

/* fields */
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 13px;line-height:1.7;font-size:15.5px}
textarea.field{resize:vertical;min-height:150px;overflow:hidden}
.field:focus{border-color:var(--accent);outline:none;background:var(--surface)}

/* translation tabs */
.src-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px -4px 14px;overflow-x:auto}
.src-tabs button{border:0;background:none;padding:8px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.src-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.src-tabs .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.passage{font-family:var(--f-scripture);font-size:17.5px;line-height:2;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-width:62ch}
.passage .vn{font-family:var(--f-ui);font-size:.62em;font-weight:600;color:var(--gold);vertical-align:.45em;padding-right:2px}
mark.hl{color:inherit;border-radius:3px;padding:.08em 0;cursor:pointer}
.hl-y{background:var(--hl-y)} .hl-g{background:var(--hl-g)} .hl-b{background:var(--hl-b)} .hl-p{background:var(--hl-p)}
.passage-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.paste{display:flex;flex-direction:column;gap:10px}
.paste ol{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px}

/* highlight memos */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:17px;font-weight:600}
.memo-list{display:flex;flex-direction:column;gap:12px}
.memo{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.memo.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.quote{font-family:var(--f-scripture);font-size:15.5px;line-height:1.75;padding:2px 8px;border-radius:4px;margin:0;word-break:keep-all}
.memo-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px}

/* notes */
.notes{display:grid;gap:14px}
.note{display:flex;flex-direction:column;gap:8px}
.note h3{font-size:15px;font-weight:600}
.note h3 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted);line-height:1.6}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;background:var(--accent-soft);color:var(--ink);line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

/* highlight bar */
.hlbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgb(0 0 0 / .08);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hlbar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hlbar .pv{flex:1 1 200px;min-width:0;font-family:var(--f-scripture);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}

/* prayer */
.pray-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pray-head h1{font-family:var(--f-scripture);font-size:26px}
.meter{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.meter b{color:var(--accent);font-size:20px}
.pgrid{display:flex;flex-direction:column;gap:18px}
.pgroup{display:flex;flex-direction:column;gap:12px;padding:20px 22px}
.pgroup h2{font-family:var(--f-scripture);font-size:20px;display:flex;align-items:baseline;gap:8px}
.pgroup h2 small{font-family:var(--f-ui);font-size:13px;font-weight:400;color:var(--muted)}
.addrow{display:flex;gap:8px;align-items:flex-end}
.addrow input,.addrow textarea{flex:1;min-width:0}
.addrow textarea{min-height:110px;resize:vertical}
.addcol{display:flex;flex-direction:column;gap:8px}
.addcol .go{align-self:flex-end}
.who{display:inline-block;font-weight:600;color:var(--accent);margin-right:6px}
.pitem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.ptext{white-space:pre-wrap;font-size:15.5px;line-height:1.7}
.backup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.pitem:first-of-type{border-top:0}
.pcheck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px;padding:0}
.pcheck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ptext{word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.pitem.answered .ptext{color:var(--muted)}
.pbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.pact{display:flex;gap:2px;flex-wrap:wrap;margin-left:-8px}
.pact .btn{padding:2px 8px;font-size:12.5px}
.pcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
details.answered-box summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}

/* search */
.searchbox{display:flex;flex-direction:column;gap:12px}
.searchbox input[type=search]{font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.results{display:flex;flex-direction:column;gap:10px}
.res{text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.res:hover{border-color:var(--accent)}
.res-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kind{font-weight:600;color:var(--ink);font-size:12.5px}
.res .txt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--hl-y);color:inherit;border-radius:2px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-head h1{font-family:var(--f-scripture);font-size:24px;margin-right:auto;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.grid-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.cal .wd{padding:6px 0;text-align:center;font-size:12px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .wd.su{color:var(--sun)} .cal .wd.sa{color:var(--sat)}
.day{min-height:86px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;background:transparent;border-top:0;border-left:0;min-width:0}
.day.out{background:var(--sunk);opacity:.6}
.day .n{font-size:12.5px;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.su .n{color:var(--sun)} .day.sa .n{color:var(--sat)}
.day.hol .n{color:var(--sun);font-weight:600}
.day.sa{background:color-mix(in srgb,var(--sat) 5%,transparent)} .day.su,.day.hol{background:color-mix(in srgb,var(--sun) 5%,transparent)}
.day .hn{display:block;font-size:10.5px;line-height:1.3;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.hday{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--sun);margin-left:8px}
.holnote{font-size:12px;color:var(--muted)}
@media (max-width:540px){.day .hn{font-size:9.5px;padding-left:0}}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.pill{display:block;font-size:11.5px;line-height:1.5;border-radius:4px;padding:0 5px;color:#fff;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);padding-left:3px}
@media (max-width:540px){.day{min-height:58px;padding:3px}.pill{height:5px;padding:0;font-size:0}.day .n{font-size:12px;width:22px;height:22px}}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.ev .bar{align-self:stretch;border-radius:2px;background:var(--c)}
.ev .t{font-weight:600}
.ev .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .memo-t{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.ev .cat{font-size:12px;color:var(--c);font-weight:600;white-space:nowrap}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(10 16 18 / .45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-family:var(--f-scripture);font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg label.lbl{display:block}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13.5px}
.catpick button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-actions .left{margin-right:auto}
.err{color:var(--danger);font-size:13px;margin:0}
/* lock */
.lock{max-width:360px;margin:40px auto 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:32px 24px}
.lock h1{font-family:var(--f-scripture);font-size:22px}
.pin{width:170px;text-align:center;font-size:26px;letter-spacing:.5em;padding-left:.5em;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* sermon / edu notes */
.nlist{display:flex;flex-direction:column;gap:10px}
.ncard{text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ncard:hover{border-color:var(--accent)}
.ncard .nt{font-family:var(--f-scripture);font-size:18px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.ncard .nm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ntitle{font-family:var(--f-scripture);font-size:22px;font-weight:700}
.nmeta{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px}
.bigtext{min-height:360px!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* app additions */
:root{--ev-etc:#6F6630}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ev-etc:#CFC27A}}
:root[data-theme="dark"]{--ev-etc:#CFC27A}
#login{min-height:80dvh;display:grid;place-items:center}
#login form{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
#login h1{font-family:var(--f-scripture);font-size:28px}
#login .btn{padding:11px 16px;font-size:15px}
.top{padding-top:max(8px,env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<section id="login" hidden>
  <form id="loginform">

// 일정(ev-·vx-)은 건캘과 같은 표(docs)에, 나머지 기록은 jb_docs에 둔다
const tableOf = id => /^(ev|vx)-/.test(id) ? "docs" : "jb_docs";
let pending = ls.get("jubasi-pending", {});   // id -> data, 삭제는 null
let flushing = false, session = null;
const timers = {}, dirty = new Set();
function setSync(t, err){ const el = $("#sync"); el.textContent = t; el.classList.toggle("err", !!err); }
let cacheT = 0;
function cacheDocs(){ clearTimeout(cacheT); cacheT = setTimeout(()=>{ ls.set("jubasi-cache", S.docs); ls.set("jubasi-plan", S.plan); }, 300); }
function saveNow(id){
  clearTimeout(timers[id]); delete timers[id];
  pending[id] = S.docs[id] ? clone(S.docs[id]) : null; ls.set("jubasi-pending", pending); cacheDocs();
  dirty.delete(id); flush();
}
async function flush(){
  if (flushing || !session) return; flushing = true;
  try {
    while (Object.keys(pending).length){
      if (!navigator.onLine){ setSync("오프라인 · 연결되면 저장돼요", true); return; }
      setSync("저장 중…");
      const snap = clone(pending), ups = {docs:[], jb_docs:[]}, dels = {docs:[], jb_docs:[]};
      for (const [id, data] of Object.entries(snap)) (data ? ups : dels)[tableOf(id)].push(data ? {id, data} : id);
      let err = null;
      for (const t of ["docs","jb_docs"]){
        for (let i = 0; i < ups[t].length && !err; i += 200){ const r = await sb.from(t).upsert(ups[t].slice(i, i+200)); err = r.error; }
        if (dels[t].length && !err){ const r = await sb.from(t).delete().in("id", dels[t]); err = r.error; }
      }
      if (err){
        if (/JWT|auth|401/i.test(err.message||"")) { setSync("다시 로그인해 주세요", true); return; }
        setSync("저장하지 못했어요 · 잠시 후 다시 시도해요", true);
        await new Promise(r=>setTimeout(r, 4000 + Math.random()*2000)); continue;
      }
      for (const [id, data] of Object.entries(snap)) if (JSON.stringify(pending[id]) === JSON.stringify(data)) delete pending[id];
      ls.set("jubasi-pending", pending);
    }
    setSync("저장됨");
  } finally { flushing = false; }
}
window.addEventListener("online", flush);

const qtId = d => "qt-" + d;
function blankQT(date){ return {kind:"qt", date, ref:"", title:"", texts:{krv:"",niv:"",klb:""}, hl:[], notes:{feel:{t:"",cats:[]},apply:{t:"",cats:[]},ask:{t:"",cats:[]},song:{name:"",t:"",cats:[]}}, updated:0}; }
function getQT(date = S.date){
  const d = S.docs[qtId(date)]; if (!d) return blankQT(date);
  const b = blankQT(date);
  return {...b, ...d, texts:{...b.texts, ...(d.texts||{})}, notes:{...b.notes, ...(d.notes||{})}, hl: d.hl || []};
}
function mutQT(fn, later){ const d = clone(getQT()); fn(d); d.updated = Date.now(); setDoc(qtId(S.date), d, later); return d; }
function refOf(date = S.date){ const q = getQT(date), p = S.plan[date] || {}; return {ref: q.ref || p.ref || "", title: q.title || p.title || "", fromPlan: !q.ref && !!p.ref}; }

function engRef(ref){
  const m = /^(.+?)\s*(\d[\d:\-–~ ]*)$/.exec((ref||"").trim()); if (!m) return null;
  const en = BOOKS[m[1].replace(/\s/g,"")]; if (!en) return null;
  return `${en} ${m[2].replace(/[–~]/g,"-").replace(/\s/g,"")}`;
}
function links(date){
  const {ref} = refOf(date); const e = engRef(ref); const d = parseD(date);
  const bg = v => e ? `https://www.biblegateway.com/passage/?search=${encodeURIComponent(e)}&version=${encodeURIComponent(v)}` : "https://www.biblegateway.com/";
  return {
    krv: `https://www.su.or.kr/03bible/daily/qtView.do?qtType=QT1&year=${d.getFullYear()}&month=${d.getMonth()+1}&day=${d.getDate()}`,
    niv: bg("NIV"), klb: bg("KLB"), both: bg("NIV;KLB")
  };
}

/* ---------- verse numbers + passage render ---------- */
function verseMarks(t){
  const re = /(^|[\s\u00a0])(\d{1,3})(?=[\s\u00a0]?[^\d\s.,:;)\]\-])/g; let m, last = null; const res = [];
  while ((m = re.exec(t))){
    const n = +m[2], s = m.index + m[1].length, e = s + m[2].length;
    const lineStart = s === 0 || t[s-1] === "\n";
    const ok = last === null ? lineStart : (n === last+1 || n === last+2 || n === 1);
    if (ok){ res.push([s,e]); last = n; }
  }
  return res;
}
function passageHTML(text, hls){
  const L = text.length, pts = new Set([0,L]), vn = verseMarks(text);
  vn.forEach(([s,e])=>{pts.add(s);pts.add(e);});
  const hs = hls.filter(h => h.s < h.e && h.e <= L);
  hs.forEach(h=>{pts.add(h.s);pts.add(h.e);});
  const arr = [...pts].sort((a,b)=>a-b); let out = "";
  for (let i=0;i<arr.length-1;i++){
    const a = arr[i], b = arr[i+1]; if (a===b) continue;
    let seg = esc(text.slice(a,b));
    if (vn.some(([s,e])=>s<=a&&e>=b)) seg = `<span class="vn">${seg}</span>`;
    const h = [...hs].reverse().find(h=>h.s<=a&&h.e>=b);
    if (h) seg = `<mark class="hl hl-${h.color}" data-hl="${h.id}">${seg}</mark>`;
    out += seg;
  }
  return out;
}
function cleanPaste(t){ return t.replace(/\r\n?/g,"\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); }

const TYPES = [{k:"all",n:"전체"},{k:"memo",n:"본문 메모"},{k:"feel",n:"느낀 점"},{k:"apply",n:"적용점"},{k:"ask",n:"궁금증"},{k:"song",n:"찬양"},{k:"sermon",n:"설교 노트"},{k:"edu",n:"교육 노트"},{k:"book",n:"독서 노트"},{k:"free",n:"메모"},{k:"prayer",n:"기도제목"}];
function records(){
  const out = [];
  for (const [id,d] of Object.entries(S.docs)){
    if (d.kind === "note"){
      const tn = NTYPES[d.type] ? d.type : "sermon", T = NTYPES[tn];
      (d.quotes||[]).forEach(q=>{ if (q.text || q.memo) out.push({type:tn, date:d.date, ref:`${d.title || "제목 없음"}${q.page ? " · " + q.page + "쪽" : ""}`, quote:q.text, text:q.memo||"", cats:q.cats||[], go:{tab:tn, note:id, el:"q-"+q.id}, ts:d.updated}); });
      out.push({type:tn, date:d.date, ref:[d.title || (d.type==="free" ? "" : "제목 없음"), d.speaker, d.ref].filter(Boolean).join(" · "), text:[d.content, d.apply ? "적용: " + d.apply : ""].filter(Boolean).join("\n"), cats:d.cats||[], go:{tab:tn, note:id}, ts:d.updated});
      (d.hl||[]).forEach(h=>{ if (h.memo || (h.cats||[]).length) out.push({type:"memo", date:d.date, ref:`${T.one} · ${d.title || "제목 없음"}`, quote:h.text, text:h.memo||"", cats:h.cats||[], go:{tab:tn, note:id, el:"hl-"+h.id}, ts:h.ts||d.updated}); });
      continue;
    }
    if (d.kind === "prayer" && !S.unlocked) continue;
    if (d.kind === "qt"){
      const ref = d.ref || (S.plan[d.date]||{}).ref || "";
      (d.hl||[]).forEach(h=>{ if (h.memo || (h.cats||[]).length) out.push({type:"memo", date:d.date, ref, quote:h.text, text:h.memo||"", cats:h.cats||[], go:{date:d.date, el:"hl-"+h.id, src:h.src}, ts:h.ts||d.updated}); });
      for (const n of NOTES){ const v = (d.notes||{})[n.k]; if (v && (v.t || v.name)) out.push({type:n.k, date:d.date, ref, text:(v.name ? "♪ "+v.name+(v.t?"\n":"") : "") + (v.t||""), cats:v.cats||[], go:{date:d.date}, ts:d.updated}); }
    } else if (d.kind === "prayer"){
      out.push({type:"prayer", date: d.created ? ymd(new Date(d.created)) : "", ref: [PGROUPS.find(g=>g.k===d.group)?.n, d.who].filter(Boolean).join(" · "), text: d.text + (d.answered && d.answerNote ? "\n응답: " + d.answerNote : ""), cats:d.cats||[], answered:d.answered, go:{tab:"pray"}, ts:d.created});
    }
  }
  return out;
}

      <div class="evlist">${selEvs.length ? selEvs.map(evCard).join("") : `<div class="empty">이 날은 일정이 없어요.</div>`}</div>` : ""}

  render(true); window.scrollTo(0,0);
}
$("#tabs").addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });

/* ---------- interactions ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const chip = t.closest("[data-chip]");
  if (chip){
    const key = chip.dataset.chip, cat = chip.dataset.cat;
    const tog = arr => arr.includes(cat) ? arr.filter(x=>x!==cat) : [...arr, cat];
    if (key === "q"){ S.qCats = tog(S.qCats); chip.setAttribute("aria-pressed", S.qCats.includes(cat)); renderSearch(false); return; }
    const [kind, id, sub] = key.split(":");
    if (kind === "note-cat") mutNote(id, d=>{ d.cats = tog(d.cats); });
    if (kind === "nq") mutNote(id, d=>{ const q = d.quotes.find(x=>x.id===sub); if (q) q.cats = tog(q.cats||[]); });
    if (kind === "nhl") mutNote(id, d=>{ const h = d.hl.find(x=>x.id===sub); if (h) h.cats = tog(h.cats||[]); });
    if (kind === "note") mutQT(d=>{ d.notes[id].cats = tog(d.notes[id].cats||[]); });
    if (kind === "hl") mutQT(d=>{ const h = d.hl.find(x=>x.id===id); if (h) h.cats = tog(h.cats||[]); });
    if (kind === "pr"){ const p = clone(S.docs[id]); p.cats = tog(p.cats||[]); setDoc(id, p); }
    chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed")!=="true");
    if (kind === "pr") renderPray();
    return;
  }
  const srcB = t.closest("[data-src]");
  if (srcB && srcB.closest(".src-tabs")){ S.src = srcB.dataset.src; S.editSrc = null; renderQT(); return; }
  const mk = t.closest("mark[data-hl]");
  if (mk){ const c = $("#hl-"+mk.dataset.hl); if (c){ c.scrollIntoView({behavior:"smooth", block:"center"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); } return; }
  const qtb = t.closest("[data-qtype]");
  if (qtb){ S.qType = qtb.dataset.qtype; document.querySelectorAll("[data-qtype]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.qtype===S.qType)); renderSearch(false); return; }
  const res = t.closest("[data-res]");
  if (res){ const r = lastResults[+res.dataset.res]; if (!r) return;
    if (r.go.note){ S.noteOpen[r.go.tab] = r.go.note; S.noteEditText = null; setTab(r.go.tab); }
    else if (r.go.tab){ setTab(r.go.tab); return; }
    else { S.date = r.go.date; if (r.go.src) S.src = r.go.src; setTab("qt"); }
    if (r.go.el) setTimeout(()=>{ const c = $("#"+r.go.el); if (c){ c.scrollIntoView({block:"center"}); c.classList.add("flash"); } }, 60);
    return; }
  const day = t.closest("[data-day]");
  if (day){ S.calSel = day.dataset.day; const d = parseD(S.calSel); if (d.getMonth()!==S.calM){ S.calY=d.getFullYear(); S.calM=d.getMonth(); } renderCal(); return; }
  const evb = t.closest("[data-ev]");
  if (evb){ openEv(evb.dataset.ev); return; }
  const nb = t.closest("[data-note]");
  if (nb){ S.noteOpen[nb.dataset.type] = nb.dataset.note; S.noteEditText = null; S.armed = null; render(true); window.scrollTo(0,0); return; }

  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act !== "del-hl" && act !== "pr-del" && act !== "note-del" && act !== "q-del") S.armed = null;
  switch (act){
    case "day": S.date = addDays(S.date, +a.dataset.n); S.editSrc = null; S.editRef = false; renderQT(); break;
    case "today": S.date = todayStr(); S.editSrc = null; S.editRef = false; renderQT(); break;
    case "ref-edit": S.editRef = true; renderQT(); $("#ref-in")?.focus(); break;
    case "ref-cancel": S.editRef = false; renderQT(); break;
    case "save-ref": {
      const ref = $("#ref-in").value.trim(), title = $("#title-in").value.trim(), p = S.plan[S.date] || {};
      mutQT(d=>{ d.ref = ref === (p.ref||"") ? "" : ref; d.title = title === (p.title||"") ? "" : title; });
      S.editRef = false; renderQT(); break; }
    case "edit-text": S.editSrc = S.src; renderQT(); $("#paste-in")?.focus(); break;
    case "cancel-text": S.editSrc = null; renderQT(); break;
    case "save-text": {
      const nt = cleanPaste($("#paste-in").value);
      mutQT(d=>{
        d.texts[S.src] = nt;
        d.hl = d.hl.flatMap(h=>{ if (h.src!==S.src) return [h]; if (nt.slice(h.s,h.e)===h.text) return [h];
          const i = nt.indexOf(h.text); return i<0 ? [] : [{...h, s:i, e:i+h.text.length}]; });
      });
      S.editSrc = null; renderQT(); break; }
    case "del-hl": {
      const ctx = a.dataset.ctx || "qt";
      if (S.armed !== id){ S.armed = id; render(true); break; }
      S.armed = null;
      if (ctx === "qt") mutQT(d=>{ d.hl = d.hl.filter(h=>h.id!==id); });
      else mutNote(ctx.slice(5), d=>{ d.hl = d.hl.filter(h=>h.id!==id); });
      render(true); break; }
    case "lock": S.unlocked = false; renderPray(); break;
    case "q-add": {
      const qid = rid();
      mutNote(a.dataset.nid, d=>{ d.quotes.push({id:qid, text:"", page:"", memo:"", cats:[]}); });
      render(true); const c = $("#q-"+qid); if (c){ c.scrollIntoView({block:"center"}); c.querySelector("textarea")?.focus({preventScroll:true}); } break; }
    case "q-del":
      if (S.armed !== id){ S.armed = id; render(true); break; }
      S.armed = null; mutNote(a.dataset.nid, d=>{ d.quotes = d.quotes.filter(q=>q.id!==id); }); render(true); break;
    case "note-new": {
      const ty = a.dataset.type, nid = "sn-" + rid();
      setDoc(nid, blankNote(ty)); S.noteOpen[ty] = nid; S.noteEditText = null;
      renderNotes(ty); window.scrollTo(0,0); $("#n-title")?.focus(); break; }
    case "note-back": {
      const ty = a.dataset.type, nid = S.noteOpen[ty], n = nid && getNote(nid);
      if (n && noteEmpty(n)) delDoc(nid);
      S.noteOpen[ty] = null; S.noteEditText = null; renderNotes(ty); window.scrollTo(0,0); break; }
    case "note-del": {
      const ty = a.dataset.type;
      if (S.armed !== id){ S.armed = id; renderNotes(ty); break; }
      S.armed = null; delDoc(id); S.noteOpen[ty] = null; renderNotes(ty); window.scrollTo(0,0); break; }
    case "note-edit-text": S.noteEditText = a.dataset.nid; render(true); $("#n-paste")?.focus(); break;
    case "note-cancel-text": S.noteEditText = null; render(true); break;
    case "note-save-text": {
      const nid = a.dataset.nid, nt = cleanPaste($("#n-paste").value);
      mutNote(nid, d=>{
        d.text = nt;
        d.hl = d.hl.flatMap(h=>{ if (nt.slice(h.s,h.e)===h.text) return [h]; const i = nt.indexOf(h.text); return i<0 ? [] : [{...h, s:i, e:i+h.text.length}]; });
      });
      S.noteEditText = null; render(true); break; }
    case "pick": { const k = a.dataset.key; S.openPick.has(k) ? S.openPick.delete(k) : S.openPick.add(k); render(true); break; }
    case "pray": { const p = clone(S.docs[id]), td = todayStr(); p.prayed = (p.prayed||[]).includes(td) ? p.prayed.filter(x=>x!==td) : [...(p.prayed||[]), td]; setDoc(id, p); renderPray(); break; }
    case "answer": { const p = clone(S.docs[id]); p.answered = !p.answered; p.answeredAt = p.answered ? Date.now() : null; setDoc(id, p); renderPray(); break; }
    case "pr-edit": S.editPr = S.editPr===id ? null : id; renderPray(); $("#pr-edit")?.focus(); break;
    case "pr-save": { const v = $("#pr-edit").value.trim(), w = $("#pr-who"); if (v){ const p = clone(S.docs[id]); p.text = v; if (w) p.who = w.value.trim(); setDoc(id, p); } S.editPr = null; renderPray(); break; }
    case "pr-del":
      if (S.armed !== id){ S.armed = id; renderPray(); break; }
      S.armed = null; delDoc(id); renderPray(); break;
    case "mon": { const d = new Date(S.calY, S.calM + +a.dataset.n, 1); S.calY = d.getFullYear(); S.calM = d.getMonth(); S.calSel = null; renderCal(); break; }
    case "mon-today": { const d = new Date(); S.calY = d.getFullYear(); S.calM = d.getMonth(); S.calSel = todayStr(); renderCal(); break; }
    case "ev-new": openEv(null, a.dataset.date); break;
  }
});
document.addEventListener("change", e=>{
  if (e.target.id === "qt-date" && e.target.value){ S.date = e.target.value; S.editSrc = null; S.editRef = false; renderQT(); }

document.addEventListener("input", e=>{
  const t = e.target, f = t.dataset.f;
  if (t.id === "q-in"){ S.q = t.value; renderSearch(false); return; }
  if (t.id === "pin"){
    t.value = t.value.replace(/\D/g, "").slice(0,4);

      if (pinHash(t.value) === PIN_H){ S.unlocked = true; renderPray(); }

  if (t.dataset.qf){ const qf = t.dataset.qf, qid = t.dataset.qid; mutNote(t.dataset.nid, d=>{ const q = d.quotes.find(x=>x.id===qid); if (q) q[qf] = t.value; }, true); return; }
  if (t.dataset.nf){ const nf = t.dataset.nf; mutNote(t.dataset.nid, d=>{ d[nf] = t.value; }, true); return; }
  if (f === "hl" && t.dataset.ctx && t.dataset.ctx !== "qt"){ mutNote(t.dataset.ctx.slice(5), d=>{ const h = d.hl.find(x=>x.id===t.dataset.id); if (h) h.memo = t.value; }, true); return; }
  if (f === "note") mutQT(d=>{ d.notes[t.dataset.k].t = t.value; }, true);
  else if (f === "note-name") mutQT(d=>{ d.notes[t.dataset.k].name = t.value; }, true);
  else if (f === "hl") mutQT(d=>{ const h = d.hl.find(x=>x.id===t.dataset.id); if (h) h.memo = t.value; }, true);
  else if (f === "answer"){ const p = clone(S.docs[t.dataset.id]); p.answerNote = t.value; setDoc(t.dataset.id, p, true); }

document.addEventListener("keydown", e=>{

/* ---------- 입력칸이 글 길이만큼 자라기 ---------- */
/* 높이를 다시 잴 때 칸이 잠깐 줄어들면서 화면이 끝으로 밀리던 문제: 재기 전 스크롤 위치를 기억했다가 그대로 되돌린다. */
function grow(t){
  if (!t || t.tagName !== "TEXTAREA" || !t.offsetParent) return;
  const se = document.scrollingElement || document.documentElement;
  const keep = [];
  for (let el = t.parentElement; el && el !== se; el = el.parentElement) if (el.scrollHeight > el.clientHeight) keep.push([el, el.scrollTop]);
  const y = se.scrollTop, before = t.getBoundingClientRect().bottom;
  t.style.height = "auto";
  t.style.height = (t.scrollHeight + 2) + "px";
  keep.forEach(([el, s]) => { if (el.scrollTop !== s) el.scrollTop = s; });
  if (se.scrollTop !== y) se.scrollTop = y;
  /* 맨 끝에서 줄을 바꿔 칸 아랫부분이 화면 밖으로 나갈 때만 그만큼만 따라 내려간다 */
  if (document.activeElement === t && t.selectionEnd >= t.value.length - 1 && !keep.length) {
    const after = t.getBoundingClientRect().bottom, vb = innerHeight - 12;
    if (before <= vb && after > vb) se.scrollTop = y + (after - vb);
  }
}
function growAll(root = document){ root.querySelectorAll("textarea.field").forEach(grow); }
document.addEventListener("input", e=>grow(e.target));
let growRaf = 0;
new MutationObserver(()=>{ cancelAnimationFrame(growRaf); growRaf = requestAnimationFrame(()=>growAll()); }).observe($(".wrap"), {childList:true, subtree:true});
addEventListener("resize", ()=>{ cancelAnimationFrame(growRaf); growRaf = requestAnimationFrame(()=>growAll()); });
$("#evdlg").addEventListener("toggle", ()=>growAll($("#evdlg")));

/* ---------- highlighting ---------- */
const bar = $("#hlbar"); let pend = null, hideT = null;
function offsetIn(box, node, off){ const r = document.createRange(); r.selectNodeContents(box); r.setEnd(node, off); return r.toString().length; }
document.addEventListener("selectionchange", ()=>{
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed){ clearTimeout(hideT); hideT = setTimeout(()=>{ const s = getSelection(); if (!s.rangeCount || s.isCollapsed){ pend = null; bar.hidden = true; } }, 450); return; }
  const r = sel.getRangeAt(0), sc = r.startContainer, box = (sc.nodeType === 1 ? sc : sc.parentElement)?.closest(".passage");
  if (!box || !box.contains(r.endContainer)) { bar.hidden = true; pend = null; return; }
  const txt = box.textContent; let s = offsetIn(box, r.startContainer, r.startOffset), en = offsetIn(box, r.endContainer, r.endOffset);
  while (s<en && /\s/.test(txt[s])) s++; while (en>s && /\s/.test(txt[en-1])) en--;
  if (en <= s){ return; }
  pend = {ctx: box.dataset.ctx || "qt", src: box.dataset.src || "", s, e: en, text: txt.slice(s, en)};
  clearTimeout(hideT); $("#hlpv").textContent = "“" + pend.text + "”"; bar.hidden = false;
});
bar.addEventListener("pointerdown", e=>{
  const b = e.target.closest("[data-hlc]"); if (!b || !pend) return; e.preventDefault();
  const id = rid(), p = pend;
  const h = {id, s:p.s, e:p.e, text:p.text, color:b.dataset.hlc, memo:"", cats:[], ts:Date.now()};
  if (p.ctx === "qt") mutQT(d=>{ d.hl.push({...h, src:p.src}); });
  else mutNote(p.ctx.slice(5), d=>{ d.hl.push(h); });
  pend = null; bar.hidden = true; try { getSelection().removeAllRanges(); } catch(_){}
  render(true);
  const c = $("#hl-"+id); if (c){ c.scrollIntoView({behavior:"smooth", block:"center"}); c.classList.add("flash"); setTimeout(()=>c.querySelector("textarea")?.focus({preventScroll:true}), 350); }
});

/* ---------- data: 불러오기 + 실시간 반영 ---------- */
function showNotice(html){ const n = $("#notice"); n.innerHTML = html; n.hidden = !html; }
async function loadTable(t, q){
  const out = []; let from = 0;
  while (true){
    let r = sb.from(t).select("id,data"); if (q) r = q(r);
    const { data, error } = await r.order("id").range(from, from+999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break; from += 1000;
  }
  return out;
}
function putRow(id, data){
  if (data && data.kind === "plan"){ const d = id.replace(/^plan-/, ""); S.plan[d] = {...(PLAN[d]||{}), ...data}; delete S.plan[d].kind; return; }
  if (data && data.kind === "meta") return;
  if (data) S.docs[id] = data; else delete S.docs[id];
}
async function loadAll(){
  const [ev, jb] = await Promise.all([loadTable("docs", r=>r.eq("data->>kind","event")), loadTable("jb_docs")]);
  const keep = {}; for (const id of Object.keys(S.docs)) if (busy(id)) keep[id] = S.docs[id];
  S.docs = {}; S.plan = clone(PLAN);
  for (const r of [...ev, ...jb]) putRow(r.id, r.data);
  for (const [id, d] of Object.entries(pending)) putRow(id, d);
  for (const [id, d] of Object.entries(keep)) S.docs[id] = d;
  S.ready = true; cacheDocs();
}
let channel = null, liveT = 0;
function listen(){
  if (channel) sb.removeChannel(channel);
  const on = p=>{
    const id = (p.new && p.new.id) || (p.old && p.old.id); if (!id || busy(id)) return;
    if (p.table === "docs" && p.new && p.new.data && p.new.data.kind !== "event") return;
    const nd = p.eventType === "DELETE" ? null : p.new.data;
    if (nd && nd.kind !== "plan" && JSON.stringify(S.docs[id]) === JSON.stringify(nd)) return;
    putRow(id, nd); cacheDocs();
    clearTimeout(liveT); liveT = setTimeout(()=>render(), 120);
  };
  channel = sb.channel("jubasi-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"jb_docs" }, on)
    .on("postgres_changes", { event:"*", schema:"public", table:"docs" }, on)
    .subscribe();
}
async function refresh(){
  try {
    await loadAll(); showNotice("");
    if (!Object.keys(pending).length) setSync("저장됨"); render(); flush();
  } catch(e){
    setSync(navigator.onLine ? "불러오지 못했어요 · 앱을 다시 열면 다시 시도해요" : "오프라인 · 저장된 기록 표시 중", true);
  }
}
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible" && session){ refresh(); listen(); } });

$("#bk-out").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify({app:"jubasi", v:1, saved:Date.now(), docs:S.docs}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `경외와거룩-백업-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  $("#bk-msg").textContent = "백업 파일을 저장했어요.";
});
$("#bk-in").addEventListener("change", async e=>{
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j || typeof j.docs !== "object") throw 0;
    let n = 0;
    for (const [id, d] of Object.entries(j.docs)){
      if (!d || typeof d !== "object") continue;
      const cur = S.docs[id];
      if (cur && (cur.updated||cur.created||0) >= (d.updated||d.created||0)) continue;
      S.docs[id] = d; pending[id] = clone(d); n++;
    }
    ls.set("jubasi-pending", pending); cacheDocs(); flush(); render(true);
    $("#bk-msg").textContent = n ? `기록 ${n}개를 불러왔어요.` : "새로 불러올 기록이 없어요. 이미 다 들어 있어요.";
  } catch(_){ $("#bk-msg").textContent = "경외와 거룩 백업 파일이 아니에요. 파일을 다시 골라 주세요."; }
  e.target.value = "";
});
$("#logout").addEventListener("click", async ()=>{
  if (Object.keys(pending).length && !confirm("아직 서버에 못 보낸 기록이 있어요. 그래도 로그아웃할까요?")) return;
  await sb.auth.signOut(); ls.set("jubasi-cache", {}); ls.set("jubasi-pending", {}); location.reload();
});

/* ---------- 로그인 ---------- */
const liErr = m => { $("#li-err").textContent = m; $("#li-err").hidden = !m; };
const korAuth = m => /Invalid login/i.test(m) ? "이메일이나 비밀번호가 맞지 않아요." : /already registered/i.test(m) ? "이미 만든 계정이에요. 위의 로그인 버튼을 눌러 주세요." : /등록된 사용자/.test(m) || /Database error/i.test(m) ? "이 앱은 등록된 이메일만 쓸 수 있어요." : /Password should/i.test(m) ? "비밀번호는 6자 이상으로 정해 주세요." : m;
$("#loginform").addEventListener("submit", async e=>{
  e.preventDefault(); liErr(""); $("#li-go").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("#li-email").value.trim(), password: $("#li-pw").value });
  $("#li-go").disabled = false; if (error) liErr(korAuth(error.message));
});
$("#li-signup").addEventListener("click", async ()=>{
  liErr(""); const email = $("#li-email").value.trim(), password = $("#li-pw").value;
  if (!email || password.length < 6) return liErr("이메일과 6자 이상 비밀번호를 먼저 입력해 주세요.");
  const r = await sb.auth.signUp({ email, password });
  if (r.error) return liErr(korAuth(r.error.message));
  const s = await sb.auth.signInWithPassword({ email, password });
  if (s.error) liErr(korAuth(s.error.message));
});
function showApp(on){ $("#login").hidden = on; $("#app").hidden = !on; }
sb.auth.onAuthStateChange((ev, s)=>{
  const was = !!session; session = s;
  if (s && !was){ showApp(true); render(true); refresh(); listen(); }
  if (!s){ showApp(false); }
});

/* ---------- boot ---------- */
S.docs = ls.get("jubasi-cache", {}) || {};
S.plan = {...clone(PLAN), ...(ls.get("jubasi-plan", {}) || {})};
for (const [id, d] of Object.entries(pending)) putRow(id, d);
const h0 = (location.hash||"").slice(1); if (PANELS[h0]) S.tab = h0;
setTab(S.tab);
setSync(Object.keys(S.docs).length ? "저장된 기록 표시 중" : "불러오는 중…");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
sb.auth.getSession().then(({data})=>{ if (!data.session) showApp(false); });
})();
