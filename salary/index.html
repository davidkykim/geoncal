<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>급여 자동배분 계산기</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="급여배분">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d21" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  @font-face{font-family:'Jost';font-weight:400;font-display:swap;src:url(jost-latin-400-normal.woff2) format('woff2');}
  @font-face{font-family:'Jost';font-weight:500;font-display:swap;src:url(jost-latin-500-normal.woff2) format('woff2');}
  @font-face{font-family:'Jost';font-weight:700;font-display:swap;src:url(jost-latin-700-normal.woff2) format('woff2');}

  /* 화면 두 장: ① 계산기(위 회색 표시창 + 아래 흰 숫자판) ② 배분 결과 */
  :root{
    color-scheme:light;
    --disp:#eef1f4; --pad:#ffffff; --ink:#111214; --sub:#8b9098; --faint:#c9ced6; --line:#e9ecf0;
    --accent:#e0574f; --accent-soft:#fbe4e2; --press:#f2f4f7;
    --c1:#e0574f; --c2:#f2a08f; --c3:#2f3540; --c4:#6b7482; --c5:#a7aeb8; --c6:#d5d9df;
    --num:'Jost','Futura',-apple-system,BlinkMacSystemFont,sans-serif;
    --kr:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --disp:#1b1d21; --pad:#0f1012; --ink:#f4f5f7; --sub:#8d929b; --faint:#4a4f57; --line:#24272c;
      --accent:#f0675e; --accent-soft:#3a1f1d; --press:#1c1e22;
      --c1:#f0675e; --c2:#f4a594; --c3:#e6e8ec; --c4:#9aa2ae; --c5:#666d78; --c6:#3b4048;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important}
  html,body{height:100%;}
  body{
    margin:0; background:var(--pad); color:var(--ink); font-family:var(--kr);
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }
  button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:12px;}

  .app{position:relative; width:100%; max-width:460px; height:100dvh; margin:0 auto; overflow:hidden; background:var(--pad);}
  @media (min-width:600px){
    body{background:var(--disp); display:flex; align-items:center;}
    .app{height:min(100dvh, 880px); border-radius:28px; box-shadow:0 20px 60px rgba(0,0,0,.12);}
  }
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; transition:transform .32s cubic-bezier(.2,.75,.2,1);}
  #result{transform:translateX(100%); background:var(--pad);}
  .app.show-result #calc{transform:translateX(-28%);}
  .app.show-result #result{transform:none;}
  @media (prefers-reduced-motion:reduce){ .screen{transition:none;} }

  /* ── 표시창 ── */
  .display{
    background:var(--disp); flex:1 1 auto; min-height:190px;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top,0px)) 26px 22px;
  }
  .topbar{display:flex; justify-content:space-between; align-items:center;}
  .tabs{display:flex; gap:18px;}
  .tab{font-size:15px; font-weight:600; color:var(--sub); padding:8px 0; position:relative;}
  .tab[aria-selected="true"]{color:var(--ink);}
  .tab[aria-selected="true"]::after{content:""; position:absolute; left:0; right:0; bottom:2px; height:2px; border-radius:2px; background:var(--accent);}
  .go{font-size:15px; font-weight:600; color:var(--accent); padding:8px 0 8px 12px;}
  .readout{text-align:right; min-width:0;}
  .other{font-size:13px; color:var(--sub); margin-bottom:10px; font-variant-numeric:tabular-nums;}
  .other b{font-family:var(--num); font-weight:500; color:var(--ink); opacity:.7; letter-spacing:.01em;}
  .expr{font-family:var(--num); font-size:17px; color:var(--sub); min-height:24px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl;}
  .expr span{direction:ltr; unicode-bidi:isolate;}
  .big{font-family:var(--num); font-weight:700; font-size:58px; line-height:1.05; letter-spacing:-.01em; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .big small{font-size:.42em; font-weight:500; margin-left:4px; color:var(--sub); font-family:var(--kr);}
  .man{font-size:13px; color:var(--sub); margin-top:6px; min-height:19px;}

  /* ── 숫자판 ── */
  .keys{
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(62px,1fr);
    padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px)); flex:0 0 auto;
    height:min(58dvh, 470px);
  }
  .key{
    font-family:var(--num); font-size:28px; font-weight:500; border-radius:18px;
    display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none;
    transition:background .12s ease;
  }
  .key:active,.key.hit{background:var(--press);}
  .key.fn{font-size:24px;}
  .key.op{color:var(--accent); font-size:30px; font-weight:400;}
  .key.eq{color:var(--accent); font-size:34px; font-weight:400;}
  .key.wide{grid-column:span 2;}
  .key.small{font-size:22px;}
  .key svg{width:28px; height:28px;}

  /* ── 결과 화면 ── */
  .rhead{background:var(--disp); padding:calc(14px + env(safe-area-inset-top,0px)) 26px 22px;}
  .back{font-size:15px; font-weight:600; color:var(--accent); padding:8px 12px 8px 0; display:inline-flex; align-items:center; gap:4px;}
  .back svg{width:18px; height:18px;}
  .rsum{text-align:right; margin-top:14px;}
  .rsum .label{font-size:13px; color:var(--sub);}
  .rsum .big{font-size:46px;}
  .bar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--line); margin-top:18px;}
  .bar span{height:100%;}
  .warn{margin:14px 22px 0; padding:11px 14px; border-radius:12px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;}

  .list{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 22px calc(30px + env(safe-area-inset-bottom,0px));}
  .item{border-bottom:1px solid var(--line);}
  .item:last-of-type{border-bottom:0;}
  .row{width:100%; display:flex; align-items:center; gap:12px; padding:16px 4px; text-align:left;}
  .num{font-family:var(--num); font-size:13px; color:var(--sub); width:16px; flex:none;}
  .sw{width:8px; height:8px; border-radius:50%; flex:none;}
  .name{flex:1; min-width:0;}
  .name b{display:block; font-size:15.5px; font-weight:600;}
  .name i{display:block; font-style:normal; font-size:12px; color:var(--sub); margin-top:2px;}
  .amt{text-align:right; flex:none;}
  .amt b{display:block; font-family:var(--num); font-weight:700; font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:-.005em;}
  .amt i{display:block; font-style:normal; font-family:var(--num); font-size:12.5px; color:var(--sub);}
  .chev{width:14px; height:14px; color:var(--faint); flex:none; transition:transform .2s;}
  .item.open .chev{transform:rotate(90deg); color:var(--accent);}
  .detail{display:none; padding:0 4px 14px 36px;}
  .item.open .detail{display:block;}
  .detail div{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13.5px;}
  .detail span:first-child{color:var(--sub);}
  .detail span:last-child{font-family:var(--num); font-weight:500; font-variant-numeric:tabular-nums;}
  .rule{margin-top:20px; font-size:12px; line-height:1.8; color:var(--sub); text-align:center;}
  .verse{margin-top:12px; font-size:12.5px; color:var(--accent); text-align:center; font-style:italic;}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ① 계산기 -->
  <section class="screen" id="calc" aria-label="금액 입력">
    <div class="display">
      <div class="topbar">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-f="g" aria-selected="true">세전</button>
          <button class="tab" role="tab" data-f="n" aria-selected="false">세후</button>
        </div>
        <button class="go" id="go">배분 보기 ›</button>
      </div>
      <div class="readout">
        <div class="other" id="other"></div>
        <div class="expr" id="expr"><span></span></div>
        <div class="big" id="big" aria-live="polite">0</div>
        <div class="man" id="man"></div>
      </div>
    </div>
    <div class="keys" id="keys">
      <button class="key fn" data-k="C">C</button>
      <button class="key fn" data-k="B" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
      <button class="key small" data-k="000">000</button>
      <button class="key op" data-k="/">÷</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key op" data-k="*">×</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key op" data-k="+">+</button>
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key op" data-k="-">−</button>
      <button class="key wide" data-k="0">0</button>
      <button class="key small" data-k="00">00</button>
      <button class="key eq" data-k="=" aria-label="계산">=</button>
    </div>
  </section>

  <!-- ② 배분 결과 -->
  <section class="screen" id="result" aria-label="배분 결과">
    <div class="rhead">
      <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>계산기</button>
      <div class="rsum">
        <div class="label" id="rlabel"></div>
        <div class="big" id="rtotal">0</div>
      </div>
      <div class="bar" id="bar"></div>
    </div>
    <div class="warn" id="warn" hidden></div>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
  var FIXED_GIFT = 50000;     // 주일·감사·선교 각 5만원
  var CHUNGYAK = 250000;      // 주택청약 월 인정 한도
  var KEY = 'salaryCalc';     // 마지막으로 넣은 금액은 이 기기에만 저장
  var OPS = '+-*/';
  var SYM = {'+':'+','-':'−','*':'×','/':'÷'};
  var NAME = {g:'세전 (월급+성과금)', n:'세후 (실수령)'};

  var $ = function(id){ return document.getElementById(id); };
  function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }
  function man(n){ var r = Math.round(n/1000)/10; return (Number.isInteger(r) ? r.toLocaleString('ko-KR') : r.toFixed(1)) + '만원'; }
  function pct(p,w){ return w>0 ? (p/w*100).toFixed(1)+'%' : '0%'; }

  // ── 입력 상태: 칸마다 식(문자열)을 들고, 값은 식을 계산한 결과 ──
  var S = {f:'g', ex:{g:'4500000', n:'4000000'}, fresh:true};
  try{
    var sv = JSON.parse(localStorage.getItem(KEY)||'null');
    if(sv){ if(sv.g!=null) S.ex.g = String(sv.g); if(sv.n!=null) S.ex.n = String(sv.n); if(sv.f==='n') S.f='n'; }
  }catch(e){}

  function tokens(ex){ return ex.match(/\d+|[+\-*/]/g) || []; }
  // 곱셈·나눗셈 먼저, 끝에 남은 연산 기호는 무시
  function evaluate(ex){
    var t = tokens(ex);
    if(t.length && OPS.indexOf(t[t.length-1])>=0) t.pop();
    if(!t.length) return 0;
    var terms = [], cur = +t[0], sign = 1;
    for(var i=1;i<t.length;i+=2){
      var op = t[i], v = +t[i+1];
      if(op==='*') cur *= v;
      else if(op==='/') cur = v ? cur / v : 0;
      else { terms.push(sign*cur); sign = op==='-' ? -1 : 1; cur = v; }
    }
    terms.push(sign*cur);
    var s = 0; terms.forEach(function(x){ s+=x; });
    return Math.max(0, Math.round(s));
  }
  function hasOp(ex){ return /\d[+\-*/]/.test(ex); }
  function pretty(ex){ return tokens(ex).map(function(t){ return SYM[t] || fmt(+t); }).join(' '); }
  function val(f){ return evaluate(S.ex[f]); }

  function press(k){
    var ex = S.ex[S.f];
    if(/^\d+$/.test(k)){
      if(S.fresh){ ex = ''; S.fresh = false; }
      var last = (ex.match(/\d+$/)||[''])[0];
      if(last==='0'){ ex = ex.slice(0,-1); last=''; }
      if(last==='' && /^0+$/.test(k)) k = '0';
      if(last.length + k.length > 12) return;
      ex += k;
    } else if(OPS.indexOf(k)>=0){
      S.fresh = false;
      if(ex==='') ex = '0';
      if(OPS.indexOf(ex.slice(-1))>=0) ex = ex.slice(0,-1);
      ex += k;
    } else if(k==='C'){
      ex = ''; S.fresh = false;
    } else if(k==='B'){
      ex = S.fresh ? '' : ex.slice(0,-1); S.fresh = false;
    } else if(k==='='){
      if(hasOp(ex)){ ex = String(evaluate(ex)); S.fresh = true; }
      else { S.ex[S.f] = String(evaluate(ex)); if(S.f==='g') return setField('n'); return showResult(true); }
    }
    S.ex[S.f] = ex;
    draw();
  }

  function setField(f){
    var cur = S.f;
    S.ex[cur] = String(val(cur));   // 옮기기 전에 식을 값으로 정리
    S.f = f; S.fresh = true;
    draw();
  }

  function draw(){
    var f = S.f, o = f==='g' ? 'n' : 'g', ex = S.ex[f], v = val(f);
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.f===f); });
    $('other').innerHTML = (o==='g'?'세전':'세후') + '&nbsp; <b>' + fmt(val(o)) + '</b>';
    $('expr').firstChild.textContent = hasOp(ex) ? pretty(ex) : NAME[f];
    var big = $('big');
    big.textContent = fmt(v);
    fit(big, 58);
    $('man').textContent = v ? man(v) : '';
    try{ localStorage.setItem(KEY, JSON.stringify({g:val('g'), n:val('n'), f:f})); }catch(e){}
  }
  // 숫자가 길면 글자 크기를 줄여 한 줄에 맞춤
  function fit(el, max){
    el.style.fontSize = max+'px';
    var w = el.parentNode.clientWidth;
    if(el.scrollWidth > w) el.style.fontSize = Math.max(28, Math.floor(max * w / el.scrollWidth))+'px';
  }

  // ── 배분 계산 (아티팩트와 같은 기준) ──
  function splitRounded(total, weights, lastKey){
    var sum = 0, out = {}, wsum = 0, k;
    for(k in weights) wsum += weights[k];
    for(k in weights){ out[k] = Math.round(total * weights[k] / wsum); sum += out[k]; }
    out[lastKey] += (Math.round(total) - sum);
    return out;
  }
  function calc(G, N){
    var tithe = Math.round(G*0.10), ministry = Math.round(G*0.10);
    var giving = tithe + ministry + FIXED_GIFT*3;
    var remaining = N - giving, negative = remaining < 0;
    if(negative) remaining = 0;
    var chung = Math.min(CHUNGYAK, remaining);
    var cats = splitRounded(remaining - chung, {emergency:35, etf:45, cash:5, fixed:200}, 'fixed');
    cats.chungyak = chung;
    var etf = splitRounded(cats.etf, {sp500:25, nasdaq:10, bond:5, theme:5}, 'sp500');
    return {giving:giving, tithe:tithe, ministry:ministry, remaining:remaining, cats:cats, etf:etf, negative:negative};
  }

  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  function item(no, color, name, rule, amt, N, detail){
    return '<div class="item">'
      + '<button class="row"'+(detail?' aria-expanded="false"':' tabindex="-1"')+'>'
      + '<span class="num">'+no+'</span><span class="sw" style="background:'+color+'"></span>'
      + '<span class="name"><b>'+name+'</b><i>'+rule+'</i></span>'
      + '<span class="amt"><b>'+fmt(amt)+'</b><i>'+pct(amt,N)+'</i></span>'
      + (detail ? CHEV : '<span style="width:14px"></span>')
      + '</button>'
      + (detail ? '<div class="detail">'+detail+'</div>' : '')
      + '</div>';
  }
  function d(l,v){ return '<div><span>'+l+'</span><span>'+fmt(v)+'</span></div>'; }

  function renderResult(){
    var G = val('g'), N = val('n'), r = calc(G,N);
    var C = [css('--c1'),css('--c2'),css('--c3'),css('--c4'),css('--c5'),css('--c6')];
    $('rlabel').textContent = '세전 ' + fmt(G) + ' · 실수령';
    $('rtotal').textContent = fmt(N);
    fit($('rtotal'), 46);

    var w = $('warn');
    if(r.negative){ w.hidden=false; w.textContent='헌금('+fmt(r.giving)+'원)이 실수령액보다 큽니다. 세전·세후 금액을 확인해 주세요.'; }
    else if(r.remaining < CHUNGYAK && N>0){ w.hidden=false; w.textContent='헌금을 뗀 남은 돈이 주택청약 25만원보다 적습니다. 금액을 확인해 주세요.'; }
    else w.hidden = true;

    var rows = [
      ['헌금', r.giving], ['청약', r.cats.chungyak], ['고정지출', r.cats.fixed],
      ['비상금', r.cats.emergency], ['ETF', r.cats.etf], ['현금', r.cats.cash]
    ];
    var col = {'헌금':C[0],'청약':C[1],'고정지출':C[2],'비상금':C[3],'ETF':C[4],'현금':C[5]};
    $('bar').innerHTML = rows.map(function(x){ return '<span style="width:'+(N>0?Math.min(100,x[1]/N*100):0)+'%;background:'+col[x[0]]+'"></span>'; }).join('');

    var html = ''
      + item('1', col['헌금'], '그의 나라를 위해', '세전 20% + 15만원', r.giving, N,
          d('십일조 (세전 10%)', r.tithe) + d('주일헌금', FIXED_GIFT) + d('감사헌금', FIXED_GIFT) + d('선교헌금', FIXED_GIFT) + d('사역지원비 (세전 10%)', r.ministry))
      + item('2', col['청약'], '주택청약종합저축', '월 25만원 고정', r.cats.chungyak, N)
      + item('3', col['비상금'], '비상금 적금', '남은 돈 × 35/285', r.cats.emergency, N)
      + item('4', col['ETF'], 'ETF 적립식', '중개형 ISA · 남은 돈 × 45/285', r.cats.etf, N,
          d('미국 S&amp;P500', r.etf.sp500) + d('미국 나스닥100', r.etf.nasdaq) + d('미국채 10년', r.etf.bond) + d('휴머노이드 · AI 테마', r.etf.theme))
      + item('5', col['현금'], '현금성 · 파킹', '남은 돈 × 5/285', r.cats.cash, N)
      + item('6', col['고정지출'], '고정지출 · 생활비', '남은 돈 × 200/285', r.cats.fixed, N)
      + '<p class="rule">헌금 = 십일조 세전 10% + 사역지원비 세전 10% + 주일·감사·선교 각 5만원<br>'
      + '주택청약 25만원을 먼저 떼고, 남은 돈을 비상금 35 · ETF 45 · 현금 5 · 고정지출 200으로 나눕니다<br>'
      + 'ETF 안에서는 S&amp;P500 25 · 나스닥100 10 · 미국채 5 · 테마 5</p>'
      + '<p class="verse">"돈을 벌기 위해 투자하지 말고, 맡겨진 삶을 잘 감당하기 위해 투자하라."</p>';
    $('list').innerHTML = html;
  }

  function showResult(on){
    if(on){ S.ex.g = String(val('g')); S.ex.n = String(val('n')); S.fresh = true; draw(); renderResult(); $('list').scrollTop = 0; }
    $('app').classList.toggle('show-result', on);
    $('calc').inert = on; $('result').inert = !on;
  }

  // ── 이벤트 ──
  function buzz(){ try{ navigator.vibrate && navigator.vibrate(6); }catch(e){} }
  $('keys').addEventListener('click', function(e){
    var b = e.target.closest('.key'); if(!b) return;
    buzz(); press(b.dataset.k);
  });
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ setField(t.dataset.f); }); });
  $('go').addEventListener('click', function(){ showResult(true); });
  $('back').addEventListener('click', function(){ showResult(false); });
  $('list').addEventListener('click', function(e){
    var row = e.target.closest('.row'); if(!row || !row.hasAttribute('aria-expanded')) return;
    var it = row.parentNode, open = !it.classList.contains('open');
    it.classList.toggle('open', open); row.setAttribute('aria-expanded', open);
  });

  // 키보드(윈도우·맥)
  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var onResult = $('app').classList.contains('show-result');
    if(onResult){ if(e.key==='Escape' || e.key==='Backspace'){ e.preventDefault(); showResult(false); } return; }
    var k = e.key, map = {'Enter':'=','=':'=','Backspace':'B','Delete':'C','Escape':'C','x':'*','X':'*'};
    if(map[k]) k = map[k];
    if(/^[0-9]$/.test(k) || OPS.indexOf(k)>=0 || k==='=' || k==='B' || k==='C'){
      e.preventDefault(); press(k);
      var b = document.querySelector('.key[data-k="'+k+'"]');
      if(b){ b.classList.add('hit'); setTimeout(function(){ b.classList.remove('hit'); }, 110); }
    } else if(k==='Tab'){ e.preventDefault(); setField(S.f==='g'?'n':'g'); }
  });

  window.addEventListener('resize', function(){ fit($('big'),58); });
  if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if($('app').classList.contains('show-result')) renderResult(); }); }catch(e){} }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit($('big'),58); });

  $('result').inert = true;
  draw();

  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
